name: Immutable release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build:
    name: Build and verify immutable artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - name: Prove tag, package, main, and merged-PR identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "${GITHUB_SHA}"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main
          associated_pr="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'first(.[] | select(.merged_at != null and .base.ref == "main")) | [.merge_commit_sha, .base.sha] | @tsv')"
          IFS=$'\t' read -r associated_merge associated_base <<<"${associated_pr}"
          test "${associated_merge}" = "${GITHUB_SHA}"
          test -n "${associated_base}"
          git diff --check "${associated_base}" "${GITHUB_SHA}"
      - name: Install exact shrinkwrap without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify source, catalogs, and package contract
        run: |
          npm run typecheck
          npm run build
          npm run catalog:verify
          npm run test:unit
          npm run test:contracts
          npm run test:integration
          npm run test:runtime:claude
          npm run test:runtime:opencode
          npm run test:runtime:codex
          npm run test:harness
          npm run package:verify
      - name: Reject tracked checkout drift before packaging
        run: git diff --exit-code "${GITHUB_SHA}" -- .
      - name: Build immutable archive and provenance sidecar
        run: npm run release:build -- release-dist
      - name: Verify generated release assets again
        run: npm run release:verify -- "release-dist/oh-my-harness-${GITHUB_REF_NAME}.tgz" "release-dist/oh-my-harness-${GITHUB_REF_NAME}.release.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oh-my-harness-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  publish:
    name: Publish verified GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oh-my-harness-${{ github.sha }}
          path: release-dist
      - name: Stage, verify, and atomically publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive_name="oh-my-harness-${GITHUB_REF_NAME}.tgz"
          sidecar_name="oh-my-harness-${GITHUB_REF_NAME}.release.json"
          archive_path="release-dist/${archive_name}"
          sidecar_path="release-dist/${sidecar_name}"
          release_title="Oh My Harness ${GITHUB_REF_NAME}"
          draft_marker="<!-- oh-my-harness-release-draft:v1 tag=${GITHUB_REF_NAME} source=${GITHUB_SHA} -->"
          scratch_directory="$(mktemp -d)"
          draft_id=""
          publish_transition_started=false

          cleanup_draft() {
            status=$?
            trap - EXIT
            if [[ -n "${draft_id}" && "${publish_transition_started}" != true ]]; then
              if gh api "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" \
                  >"${scratch_directory}/cleanup-release.json" \
                && DRAFT_ID="${draft_id}" DRAFT_MARKER="${draft_marker}" \
                  node --input-type=module -e '
                    import { readFileSync } from "node:fs";
                    const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
                    if (release.id !== Number(process.env.DRAFT_ID)
                      || release.tag_name !== process.env.GITHUB_REF_NAME
                      || release.body !== process.env.DRAFT_MARKER
                      || release.draft !== true) {
                      process.exit(1);
                    }
                  ' "${scratch_directory}/cleanup-release.json"; then
                gh api -X DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" >/dev/null \
                  || echo "failed to remove unpublished release draft ${draft_id}; the next run will recover the marked draft" >&2
              else
                echo "release ${draft_id} is not the exact owned draft; refusing cleanup deletion" >&2
              fi
            fi
            rm -rf "${scratch_directory}"
            exit "${status}"
          }
          trap cleanup_draft EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          test -f "${archive_path}"
          test -f "${sidecar_path}"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            >"${scratch_directory}/releases.json"
          existing_release="$(DRAFT_MARKER="${draft_marker}" RELEASE_TITLE="${release_title}" \
            node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pages = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const matches = pages.flat().filter(
              (release) => release.tag_name === process.env.GITHUB_REF_NAME,
            );
            if (matches.length > 1) {
              throw new Error("tag has " + matches.length + " release records");
            }
            if (matches.length === 0) {
              process.stdout.write("none");
            } else {
              const release = matches[0];
              const owned = release.body === process.env.DRAFT_MARKER
                && release.name === process.env.RELEASE_TITLE
                && release.prerelease === false;
              process.stdout.write(
                String(release.id) + "\t" + String(release.draft) + "\t"
                  + String(owned),
              );
            }
          ' "${scratch_directory}/releases.json")"
          if [[ "${existing_release}" != none ]]; then
            IFS=$'\t' read -r existing_id existing_draft existing_owned \
              <<<"${existing_release}"
            [[ "${existing_id}" =~ ^[0-9]+$ ]]
            if [[ "${existing_draft}" != true ]]; then
              echo "release ${GITHUB_REF_NAME} is already published; refusing to overwrite or delete" >&2
              exit 1
            fi
            if [[ "${existing_owned}" != true ]]; then
              echo "release ${GITHUB_REF_NAME} stale draft does not carry the exact current-source marker; refusing to delete" >&2
              exit 1
            fi
            gh api -X DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${existing_id}" >/dev/null
          fi

          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="${release_title}" \
            -f body="${draft_marker}" \
            -F draft=true \
            -F prerelease=false \
            >"${scratch_directory}/created-release.json"
          draft_id="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (!Number.isSafeInteger(release.id) || release.id <= 0) {
              throw new Error("created release has no valid numeric id");
            }
            process.stdout.write(String(release.id));
          ' "${scratch_directory}/created-release.json")"
          [[ "${draft_id}" =~ ^[0-9]+$ ]]
          DRAFT_MARKER="${draft_marker}" RELEASE_TITLE="${release_title}" \
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
              if (release.draft !== true
                || release.tag_name !== process.env.GITHUB_REF_NAME
                || release.name !== process.env.RELEASE_TITLE
                || release.body !== process.env.DRAFT_MARKER
                || release.prerelease !== false) {
                throw new Error("created release draft does not match its exact source marker");
              }
            ' "${scratch_directory}/created-release.json"

          gh release upload "${GITHUB_REF_NAME}" \
            "${archive_path}" \
            "${sidecar_path}" \
            --repo "${GITHUB_REPOSITORY}"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${draft_id}/assets?per_page=100" \
            >"${scratch_directory}/assets.json"
          asset_ids="$(node --input-type=module -e '
            import { readFileSync, statSync } from "node:fs";
            import { basename } from "node:path";
            const pages = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const assets = pages.flat();
            if (assets.length !== 2) {
              throw new Error("uploaded release has " + assets.length
                + " assets, expected exactly 2");
            }
            const expected = process.argv.slice(2).map((path) => ({
              name: basename(path),
              size: statSync(path).size,
            }));
            const ordered = expected.map(({ name, size }) => {
              const matches = assets.filter((asset) => asset.name === name);
              if (matches.length !== 1
                || matches[0].size !== size
                || matches[0].state !== "uploaded"
                || !Number.isSafeInteger(matches[0].id)) {
                throw new Error("uploaded asset " + name
                  + " has unexpected identity");
              }
              return matches[0].id;
            });
            process.stdout.write(ordered.join("\t"));
          ' "${scratch_directory}/assets.json" "${archive_path}" "${sidecar_path}")"
          IFS=$'\t' read -r archive_asset_id sidecar_asset_id <<<"${asset_ids}"
          [[ "${archive_asset_id}" =~ ^[0-9]+$ ]]
          [[ "${sidecar_asset_id}" =~ ^[0-9]+$ ]]

          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${archive_asset_id}" \
            >"${scratch_directory}/${archive_name}"
          gh api -H "Accept: application/octet-stream" \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${sidecar_asset_id}" \
            >"${scratch_directory}/${sidecar_name}"
          ARCHIVE_NAME="${archive_name}" node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { readFileSync } from "node:fs";
            const [
              localArchivePath,
              localSidecarPath,
              downloadedArchivePath,
              downloadedSidecarPath,
            ] = process.argv.slice(1);
            const localArchive = readFileSync(localArchivePath);
            const localSidecar = readFileSync(localSidecarPath);
            const downloadedArchive = readFileSync(downloadedArchivePath);
            const downloadedSidecar = readFileSync(downloadedSidecarPath);
            if (!downloadedArchive.equals(localArchive)) {
              throw new Error("downloaded archive bytes differ from the uploaded source");
            }
            if (!downloadedSidecar.equals(localSidecar)) {
              throw new Error("downloaded sidecar bytes differ from the uploaded source");
            }
            const sidecar = JSON.parse(downloadedSidecar.toString("utf8"));
            const archiveDigest = createHash("sha256")
              .update(downloadedArchive)
              .digest("hex");
            if (sidecar.archive?.filename !== process.env.ARCHIVE_NAME
              || sidecar.archive?.size !== downloadedArchive.length
              || sidecar.archive?.sha256 !== archiveDigest
              || sidecar.package?.tag !== process.env.GITHUB_REF_NAME
              || sidecar.source?.commit !== process.env.GITHUB_SHA) {
              throw new Error("downloaded release assets do not match their sidecar");
            }
          ' \
            "${archive_path}" \
            "${sidecar_path}" \
            "${scratch_directory}/${archive_name}" \
            "${scratch_directory}/${sidecar_name}"

          publish_transition_started=true
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${draft_id}" \
            -F draft=false \
            -f body="Verified immutable Oh My Harness ${GITHUB_REF_NAME} artifact." \
            >"${scratch_directory}/published-release.json"
          DRAFT_ID="${draft_id}" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const release = JSON.parse(readFileSync(process.argv[1], "utf8"));
            if (release.id !== Number(process.env.DRAFT_ID)
              || release.tag_name !== process.env.GITHUB_REF_NAME
              || release.draft !== false) {
              throw new Error("release publish transition returned unexpected identity");
            }
          ' "${scratch_directory}/published-release.json"
